# parts-init
description "runs parts init as action user"

task
start on runlevel [2345]

env HOME="/home/action"
env PATH="/home/action/.parts/autoparts/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

setuid action
setgid action

console log

chdir /home/action

script
  parts update || true
  AUTOPARTS_NO_AUTOUPDATE=1 parts init -
  parts init --start
end script
